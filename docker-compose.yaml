services:
  mongo:
    image: mongo:6
    container_name: mongo-container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: task
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-network

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass "mysecretpassword"
    ports:
      - "6379:6379"
    networks:
      - backend-network

  app:
    build: .
    container_name: backend-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: "mongodb://username:password@mongo:27017/task?authSource=admin"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "mysecretpassword"
      RATE_LIMIT_PER_MINUTE: 120
      JWT_SECRET: "secret"
    depends_on:
      - mongo
      - redis
    networks:
      - backend-network

volumes:
  mongo_data:

networks:
  backend-network:
    driver: bridge
